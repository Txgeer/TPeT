    <script>
        // ============================================================
        //  扫雷 · 正负雷版  —— 完整逻辑（含12种预设配置）
        // ============================================================

        (function() {
            'use strict';

            // ---------- 常量 ----------
            const DEFAULT_ROWS = 9;
            const DEFAULT_COLS = 9;
            const DEFAULT_MINES = 10;
            const DEFAULT_POS_DOUBLE = 0;
            const DEFAULT_NEG_TOTAL = 0;
            const DEFAULT_NEG_DOUBLE = 0;
            const LONG_PRESS_MS = 450;

            // ---------- 预设配置数据 ----------
            const PRESET_DATA = [
                { name: '初级', rows: 9, cols: 9, mines: 10, posDouble: 0, negTotal: 0, negDouble: 0 },
                { name: '中级', rows: 16, cols: 16, mines: 40, posDouble: 0, negTotal: 0, negDouble: 0 },
                { name: '专家', rows: 16, cols: 30, mines: 99, posDouble: 0, negTotal: 0, negDouble: 0 },
                { name: '初级-双雷', rows: 9, cols: 9, mines: 10, posDouble: 3, negTotal: 0, negDouble: 0 },
                { name: '中级-双雷', rows: 16, cols: 16, mines: 40, posDouble: 12, negTotal: 0, negDouble: 0 },
                { name: '专家-双雷', rows: 16, cols: 30, mines: 99, posDouble: 39, negTotal: 0, negDouble: 0 },
                { name: '初级-负雷', rows: 9, cols: 9, mines: 10, posDouble: 0, negTotal: 3, negDouble: 0 },
                { name: '中级-负雷', rows: 16, cols: 16, mines: 40, posDouble: 0, negTotal: 12, negDouble: 0 },
                { name: '专家-负雷', rows: 16, cols: 30, mines: 99, posDouble: 0, negTotal: 39, negDouble: 0 },
                { name: '初级-负双雷', rows: 9, cols: 9, mines: 10, posDouble: 1, negTotal: 2, negDouble: 1 },
                { name: '中级-负双雷', rows: 16, cols: 16, mines: 40, posDouble: 5, negTotal: 7, negDouble: 2 },
                { name: '专家-负双雷', rows: 16, cols: 30, mines: 99, posDouble: 15, negTotal: 24, negDouble: 9 },
            ];

            // ---------- DOM 引用 ----------
            const gridEl = document.getElementById('grid');
            const timerDisplayEl = document.getElementById('timerDisplay');
            const resetBtn = document.getElementById('resetBtn');
            const overlay = document.getElementById('gameOverlay');
            const resultIcon = document.getElementById('resultIcon');
            const resultText = document.getElementById('resultText');
            const resultSub = document.getElementById('resultSub');
            const gridWrapper = document.getElementById('gridWrapper');
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsOverlay = document.getElementById('settingsOverlay');
            const settingsClose = document.getElementById('settingsClose');
            const settingsItems = document.getElementById('settingsItems');
            const resetDefaultColorsBtn = document.getElementById('resetDefaultColors');
            const saveSettingsBtn = document.getElementById('saveSettings');
            const configRows = document.getElementById('configRows');
            const configCols = document.getElementById('configCols');
            const configMines = document.getElementById('configMines');
            const configPosDouble = document.getElementById('configPosDouble');
            const configNegTotal = document.getElementById('configNegTotal');
            const configNegDouble = document.getElementById('configNegDouble');
            const mineHint = document.getElementById('mineHint');
            const negTotalHint = document.getElementById('negTotalHint');
            const settingsTabs = document.getElementById('settingsTabs');
            const presetGrid = document.getElementById('presetGrid');

            const pos1RemainEl = document.getElementById('pos1Remain');
            const pos2RemainEl = document.getElementById('pos2Remain');
            const neg1RemainEl = document.getElementById('neg1Remain');
            const neg2RemainEl = document.getElementById('neg2Remain');

            // ---------- 颜色变量 ----------
            const colorVars = {
                '未揭开背景': '--cell-bg',
                '已揭开背景': '--revealed-bg',
                '数字1颜色': '--num1-color',
                '数字2颜色': '--num2-color',
                '数字3颜色': '--num3-color',
                '数字4颜色': '--num4-color',
                '数字5颜色': '--num5-color',
                '数字6颜色': '--num6-color',
                '数字7颜色': '--num7-color',
                '数字8颜色': '--num8-color',
                '负数字1颜色': '--neg-num1-color',
                '负数字2颜色': '--neg-num2-color',
                '负数字3颜色': '--neg-num3-color',
                '负数字4颜色': '--neg-num4-color',
                '负数字5颜色': '--neg-num5-color',
                '负数字6颜色': '--neg-num6-color',
                '负数字7颜色': '--neg-num7-color',
                '负数字8颜色': '--neg-num8-color',
                '数字0颜色': '--zero-color',
                '+1标记颜色': '--flag-pos1-color',
                '+2标记颜色': '--flag-pos2-color',
                '-1标记颜色': '--flag-neg1-color',
                '-2标记颜色': '--flag-neg2-color',
            };

            const defaultColors = {
                '--cell-bg': '#b8c0cd',
                '--revealed-bg': '#e9edf2',
                '--num1-color': '#2c7be5',
                '--num2-color': '#27ae60',
                '--num3-color': '#e74c3c',
                '--num4-color': '#1a237e',
                '--num5-color': '#7f1d1d',
                '--num6-color': '#00838f',
                '--num7-color': '#1a1a2e',
                '--num8-color': '#5d6d7e',
                '--neg-num1-color': '#d94b8a',
                '--neg-num2-color': '#d94b2a',
                '--neg-num3-color': '#2b8fe7',
                '--neg-num4-color': '#e7c82b',
                '--neg-num5-color': '#2be7c8',
                '--neg-num6-color': '#e72b8f',
                '--neg-num7-color': '#8f2be7',
                '--neg-num8-color': '#2b8fe7',
                '--zero-color': '#ffffff',
                '--flag-pos1-color': '#e74c3c',
                '--flag-pos2-color': '#d35400',
                '--flag-neg1-color': '#2c7be5',
                '--flag-neg2-color': '#8e44ad',
            };

            // ---------- 游戏配置 ----------
            let ROWS = DEFAULT_ROWS;
            let COLS = DEFAULT_COLS;
            let TOTAL_MINES = DEFAULT_MINES;
            let POS_DOUBLE = DEFAULT_POS_DOUBLE;
            let NEG_TOTAL = DEFAULT_NEG_TOTAL;
            let NEG_DOUBLE = DEFAULT_NEG_DOUBLE;

            let configPos1 = 0;
            let configPos2 = 0;
            let configNeg1 = 0;
            let configNeg2 = 0;

            // ---------- 游戏状态 ----------
            let board = [];
            let gameActive = false;
            let gameOver = false;
            let firstClick = true;
            let flagCount = 0;
            let revealedCount = 0;
            let timerInterval = null;
            let seconds = 0;
            let timerStarted = false;

            let touchState = {
                cell: null,
                row: -1,
                col: -1,
                timer: null,
                startX: 0,
                startY: 0,
                isLongPress: false,
            };

            // ---------- 工具函数 ----------
            function formatTime(sec) {
                return String(Math.min(sec, 999)).padStart(3, '0');
            }

            // ---------- 颜色设置 ----------
            function getCurrentColors() {
                const colors = {};
                for (const [label, varName] of Object.entries(colorVars)) {
                    const val = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
                    colors[varName] = val || defaultColors[varName];
                }
                return colors;
            }
            function applyColors(colorMap) {
                for (const [varName, hex] of Object.entries(colorMap)) {
                    if (hex && hex.startsWith('#')) {
                        document.documentElement.style.setProperty(varName, hex);
                    }
                }
            }
            function saveColorsToStorage(colorMap) {
                try { localStorage.setItem('minesweeper-colors', JSON.stringify(colorMap)); } catch (_) {}
            }
            function loadColorsFromStorage() {
                try {
                    const data = localStorage.getItem('minesweeper-colors');
                    if (data) {
                        const parsed = JSON.parse(data);
                        const valid = {};
                        for (const [key, val] of Object.entries(parsed)) {
                            if (defaultColors.hasOwnProperty(key) && val && val.startsWith('#')) {
                                valid[key] = val;
                            }
                        }
                        if (Object.keys(valid).length > 0) return valid;
                    }
                } catch (_) {}
                return null;
            }
            function resetToDefaultColors() {
                applyColors(defaultColors);
                saveColorsToStorage(defaultColors);
                buildSettingsItems();
            }
            function buildSettingsItems() {
                const colors = getCurrentColors();
                let html = '';
                for (const [label, varName] of Object.entries(colorVars)) {
                    const hex = colors[varName] || defaultColors[varName];
                    html += `
                        <div class="settings-group" data-var="${varName}">
                            <label>${label}</label>
                            <div class="settings-color-row">
                                <input type="color" value="${hex}" data-var="${varName}">
                                <input type="text" value="${hex}" data-var="${varName}" spellcheck="false">
                            </div>
                        </div>
                    `;
                }
                settingsItems.innerHTML = html;
                settingsItems.querySelectorAll('.settings-color-row').forEach(row => {
                    const colorInput = row.querySelector('input[type="color"]');
                    const textInput = row.querySelector('input[type="text"]');
                    const varName = colorInput.dataset.var;
                    colorInput.addEventListener('input', function() {
                        textInput.value = this.value;
                    });
                    textInput.addEventListener('input', function() {
                        const val = this.value.trim();
                        if (/^#[0-9a-fA-F]{6}$/.test(val)) {
                            colorInput.value = val;
                        }
                    });
                    textInput.addEventListener('blur', function() {
                        const val = this.value.trim();
                        if (!/^#[0-9a-fA-F]{6}$/.test(val)) {
                            this.value = colorInput.value;
                        }
                    });
                });
            }

            // ---------- 配置存储 ----------
            function loadConfigFromStorage() {
                try {
                    const data = localStorage.getItem('minesweeper-config');
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed.rows && parsed.cols && parsed.mines !== undefined &&
                            parsed.posDouble !== undefined && parsed.negTotal !== undefined &&
                            parsed.negDouble !== undefined) {
                            return parsed;
                        }
                    }
                } catch (_) {}
                return null;
            }
            function saveConfigToStorage(rows, cols, mines, posDouble, negTotal, negDouble) {
                try {
                    localStorage.setItem('minesweeper-config', JSON.stringify({ rows, cols, mines, posDouble, negTotal,
                            negDouble }));
                } catch (_) {}
            }

            function calcConfigCounts() {
                configPos1 = TOTAL_MINES - POS_DOUBLE - NEG_TOTAL;
                configPos2 = POS_DOUBLE;
                configNeg1 = NEG_TOTAL - NEG_DOUBLE;
                configNeg2 = NEG_DOUBLE;
                if (configPos1 < 0) configPos1 = 0;
                if (configNeg1 < 0) configNeg1 = 0;
            }

            function applyConfig(rows, cols, mines, posDouble, negTotal, negDouble) {
                ROWS = rows;
                COLS = cols;
                TOTAL_MINES = mines;
                POS_DOUBLE = posDouble;
                NEG_TOTAL = negTotal;
                NEG_DOUBLE = negDouble;
                calcConfigCounts();
                // 更新输入框显示
                configRows.value = rows;
                configCols.value = cols;
                configMines.value = mines;
                configPosDouble.value = posDouble;
                configNegTotal.value = negTotal;
                configNegDouble.value = negDouble;
                updateHints();
                // 不立即更新剩余数量，等待 resetGame 后由 updateUI 刷新
            }

            function validateConfig() {
                let rows = parseInt(configRows.value, 10);
                let cols = parseInt(configCols.value, 10);
                let mines = parseInt(configMines.value, 10);
                let posDouble = parseInt(configPosDouble.value, 10);
                let negTotal = parseInt(configNegTotal.value, 10);
                let negDouble = parseInt(configNegDouble.value, 10);

                if (isNaN(rows) || rows < 1) rows = 1;
                if (isNaN(cols) || cols < 1) cols = 1;
                if (rows > 72) rows = 72;
                if (cols > 72) cols = 72;
                if (rows === 1 && cols === 1) {
                    alert('高度和宽度不能同时为 1，请至少增加一个维度。');
                    return null;
                }
                const maxTotal = Math.floor((rows * cols) / 2);
                if (isNaN(mines) || mines < 1) mines = 1;
                if (mines > maxTotal) mines = maxTotal;

                if (isNaN(posDouble) || posDouble < 0) posDouble = 0;
                if (posDouble > mines) posDouble = mines;

                if (isNaN(negTotal) || negTotal < 0) negTotal = 0;
                if (negTotal > (mines - posDouble)) negTotal = mines - posDouble;

                if (isNaN(negDouble) || negDouble < 0) negDouble = 0;
                if (negDouble > negTotal) negDouble = negTotal;

                configRows.value = rows;
                configCols.value = cols;
                configMines.value = mines;
                configPosDouble.value = posDouble;
                configNegTotal.value = negTotal;
                configNegDouble.value = negDouble;
                updateHints();
                return { rows, cols, mines, posDouble, negTotal, negDouble };
            }

            function updateHints() {
                const rows = parseInt(configRows.value) || 1;
                const cols = parseInt(configCols.value) || 1;
                const maxTotal = Math.floor((rows * cols) / 2);
                const current = parseInt(configMines.value) || 1;
                mineHint.textContent = `最大 ≤ ${maxTotal}（当前 ${Math.min(current, maxTotal)}）`;
                if (current > maxTotal) configMines.value = maxTotal;
                if (current < 1) configMines.value = 1;

                const mines = parseInt(configMines.value) || 1;
                const posDouble = parseInt(configPosDouble.value) || 0;
                if (posDouble > mines) configPosDouble.value = mines;
                const negTotal = parseInt(configNegTotal.value) || 0;
                const maxNeg = mines - posDouble;
                if (negTotal > maxNeg) configNegTotal.value = maxNeg;
                if (negTotal < 0) configNegTotal.value = 0;
                negTotalHint.textContent = `≤ 总雷数 − 正双雷数 = ${maxNeg}`;

                const negDouble = parseInt(configNegDouble.value) || 0;
                const negTotalVal = parseInt(configNegTotal.value) || 0;
                if (negDouble > negTotalVal) configNegDouble.value = negTotalVal;
                if (negDouble < 0) configNegDouble.value = 0;
            }

            function saveConfigAndApply() {
                const cfg = validateConfig();
                if (!cfg) return false;
                saveConfigToStorage(cfg.rows, cfg.cols, cfg.mines, cfg.posDouble, cfg.negTotal, cfg.negDouble);
                applyConfig(cfg.rows, cfg.cols, cfg.mines, cfg.posDouble, cfg.negTotal, cfg.negDouble);
                resetGame();
                return true;
            }

            // ---------- 预设应用 ----------
            function buildPresetButtons() {
                presetGrid.innerHTML = '';
                PRESET_DATA.forEach((p, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'preset-btn';
                    btn.dataset.index = idx;
                    btn.textContent = p.name;
                    presetGrid.appendChild(btn);
                });
            }

            function applyPreset(index) {
                const p = PRESET_DATA[index];
                if (!p) return;

                const maxTotal = Math.floor((p.rows * p.cols) / 2);
                let mines = p.mines;
                if (mines > maxTotal) {
                    alert(`预设 "${p.name}" 的雷数 (${mines}) 超过了该棋盘的最大允许值 (${maxTotal})，已自动调整为 ${maxTotal}。`);
                    mines = maxTotal;
                }

                let posDouble = p.posDouble;
                let negTotal = p.negTotal;
                let negDouble = p.negDouble;
                if (posDouble > mines) posDouble = mines;
                if (negTotal > (mines - posDouble)) negTotal = mines - posDouble;
                if (negDouble > negTotal) negDouble = negTotal;

                configRows.value = p.rows;
                configCols.value = p.cols;
                configMines.value = mines;
                configPosDouble.value = posDouble;
                configNegTotal.value = negTotal;
                configNegDouble.value = negDouble;
                updateHints();

                const cfg = validateConfig();
                if (cfg) {
                    saveConfigToStorage(cfg.rows, cfg.cols, cfg.mines, cfg.posDouble, cfg.negTotal, cfg.negDouble);
                    applyConfig(cfg.rows, cfg.cols, cfg.mines, cfg.posDouble, cfg.negTotal, cfg.negDouble);
                    resetGame();
                }
            }

            // ---------- 生成雷 ----------
            function placeMines(board, safeRow, safeCol) {
                const totalCells = ROWS * COLS;
                const maxTotal = Math.floor(totalCells / 2);
                if (TOTAL_MINES > maxTotal) TOTAL_MINES = maxTotal;
                if (POS_DOUBLE > TOTAL_MINES) POS_DOUBLE = TOTAL_MINES;
                if (NEG_TOTAL > (TOTAL_MINES - POS_DOUBLE)) NEG_TOTAL = TOTAL_MINES - POS_DOUBLE;
                if (NEG_DOUBLE > NEG_TOTAL) NEG_DOUBLE = NEG_TOTAL;
                calcConfigCounts();

                const posSingle = configPos1;
                const negSingle = configNeg1;

                if (posSingle < 0 || negSingle < 0) {
                    alert('配置不合理，请调整。');
                    return false;
                }

                const positions = [];
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        positions.push([r, c]);
                    }
                }
                const safeSet = new Set();
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = safeRow + dr;
                        const nc = safeCol + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            safeSet.add(nr * COLS + nc);
                        }
                    }
                }
                const candidates = positions.filter(([r, c]) => !safeSet.has(r * COLS + c));

                const weights = [];
                for (let i = 0; i < posSingle; i++) weights.push(1);
                for (let i = 0; i < POS_DOUBLE; i++) weights.push(2);
                for (let i = 0; i < negSingle; i++) weights.push(-1);
                for (let i = 0; i < NEG_DOUBLE; i++) weights.push(-2);

                for (let i = weights.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [weights[i], weights[j]] = [weights[j], weights[i]];
                }

                for (let attempt = 0; attempt < 2000; attempt++) {
                    const shuffled = [...candidates];
                    for (let i = shuffled.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                    }
                    if (shuffled.length < weights.length) continue;

                    for (let r = 0; r < ROWS; r++) {
                        for (let c = 0; c < COLS; c++) {
                            board[r][c].weight = 0;
                        }
                    }

                    for (let i = 0; i < weights.length; i++) {
                        const [r, c] = shuffled[i];
                        board[r][c].weight = weights[i];
                    }

                    let valid = true;
                    for (let r = 0; r < ROWS && valid; r++) {
                        for (let c = 0; c < COLS && valid; c++) {
                            let sum = 0;
                            let hasNeighbor = false;
                            for (let dr = -1; dr <= 1; dr++) {
                                for (let dc = -1; dc <= 1; dc++) {
                                    if (dr === 0 && dc === 0) continue;
                                    const nr = r + dr;
                                    const nc = c + dc;
                                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                                        const w = board[nr][nc].weight;
                                        if (w !== 0) hasNeighbor = true;
                                        sum += w;
                                    }
                                }
                            }
                            if (hasNeighbor && Math.abs(sum) > 8) {
                                valid = false;
                                break;
                            }
                            board[r][c].displayNum = sum;
                            board[r][c].hasNeighbor = hasNeighbor;
                        }
                    }
                    if (valid) {
                        return true;
                    }
                }

                alert('无法生成满足相邻雷数绝对值≤8的布局，请减少雷数或调整正负雷比例。');
                const newTotal = Math.floor(TOTAL_MINES * 0.8);
                if (newTotal < 1) return false;
                TOTAL_MINES = newTotal;
                if (POS_DOUBLE > TOTAL_MINES) POS_DOUBLE = TOTAL_MINES;
                if (NEG_TOTAL > (TOTAL_MINES - POS_DOUBLE)) NEG_TOTAL = TOTAL_MINES - POS_DOUBLE;
                if (NEG_DOUBLE > NEG_TOTAL) NEG_DOUBLE = NEG_TOTAL;
                calcConfigCounts();
                return placeMines(board, safeRow, safeCol);
            }

            // ---------- 初始化棋盘 ----------
            function createEmptyBoard() {
                const b = [];
                for (let r = 0; r < ROWS; r++) {
                    b[r] = [];
                    for (let c = 0; c < COLS; c++) {
                        b[r][c] = {
                            weight: 0,
                            revealed: false,
                            flagType: 0,
                            displayNum: 0,
                            hasNeighbor: false,
                        };
                    }
                }
                return b;
            }

            // ---------- 更新四种雷剩余数量 ----------
            function updateMineRemaining() {
                let markedPos1 = 0,
                    markedPos2 = 0,
                    markedNeg1 = 0,
                    markedNeg2 = 0;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const ft = board[r][c].flagType;
                        if (ft === 1) markedPos1++;
                        else if (ft === 2) markedPos2++;
                        else if (ft === 3) markedNeg1++;
                        else if (ft === 4) markedNeg2++;
                    }
                }

                const remainPos1 = configPos1 - markedPos1;
                const remainPos2 = configPos2 - markedPos2;
                const remainNeg1 = configNeg1 - markedNeg1;
                const remainNeg2 = configNeg2 - markedNeg2;

                pos1RemainEl.textContent = remainPos1;
                pos2RemainEl.textContent = remainPos2;
                neg1RemainEl.textContent = remainNeg1;
                neg2RemainEl.textContent = remainNeg2;

                [pos1RemainEl, pos2RemainEl, neg1RemainEl, neg2RemainEl].forEach(el => {
                    const val = parseInt(el.textContent, 10);
                    if (val < 0) el.classList.add('negative');
                    else el.classList.remove('negative');
                });
            }

            // ---------- 渲染 ----------
            function render() {
                gridEl.innerHTML = '';
                gridEl.style.gridTemplateColumns = `repeat(${COLS}, var(--cell-size))`;
                gridEl.style.gridTemplateRows = `repeat(${ROWS}, var(--cell-size))`;
                gridEl.style.gap = 'var(--gap-size)';

                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.dataset.revealed = 'false';
                        gridEl.appendChild(cell);
                    }
                }
                updateUI();
            }

            function getCellEl(row, col) {
                return gridEl.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            }

            function updateUI() {
                timerDisplayEl.textContent = formatTime(seconds);

                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const data = board[r][c];
                        const el = getCellEl(r, c);
                        if (!el) continue;

                        el.className = 'cell';
                        el.textContent = '';
                        el.style.color = '';

                        if (data.revealed) {
                            el.classList.add('revealed');
                            if (data.weight !== 0) {
                                el.classList.add('mine-shown');
                                const span = document.createElement('span');
                                span.className = 'mine-icon';
                                if (data.weight === 1) span.textContent = '💣';
                                else if (data.weight === 2) span.textContent = '💥';
                                else if (data.weight === -1) span.textContent = '❄️';
                                else if (data.weight === -2) span.textContent = '🌀';
                                el.appendChild(span);
                            } else {
                                const num = data.displayNum;
                                if (num !== 0 || data.hasNeighbor) {
                                    el.textContent = num;
                                    if (num > 0) {
                                        el.classList.add('n' + num);
                                    } else if (num < 0) {
                                        el.classList.add('nn' + Math.abs(num));
                                    } else {
                                        el.classList.add('zero');
                                    }
                                }
                            }
                        } else if (data.flagType > 0) {
                            el.classList.add('flagged');
                            const label = document.createElement('span');
                            label.className = 'flag-label';
                            if (data.flagType === 1) {
                                label.textContent = '+1';
                                label.classList.add('pos1');
                            } else if (data.flagType === 2) {
                                label.textContent = '+2';
                                label.classList.add('pos2');
                            } else if (data.flagType === 3) {
                                label.textContent = '-1';
                                label.classList.add('neg1');
                            } else if (data.flagType === 4) {
                                label.textContent = '-2';
                                label.classList.add('neg2');
                            }
                            el.appendChild(label);
                        }
                    }
                }

                updateMineRemaining();

                if (gameOver) {
                    const isWin = checkWin();
                    resetBtn.textContent = isWin ? '😎' : '😵';
                    resetBtn.classList.add('game-over');
                } else {
                    resetBtn.textContent = '😊';
                    resetBtn.classList.remove('game-over');
                }
            }

            // ---------- chord ----------
            function chord(row, col) {
                const data = board[row][col];
                if (!data.revealed) return;

                let neighbors = [];
                let totalWeight = 0;
                let positiveWeight = 0;
                let negativeWeight = 0;

                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = row + dr;
                        const nc = col + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            const neighbor = board[nr][nc];
                            if (neighbor.flagType > 0) {
                                let weight = 0;
                                if (neighbor.flagType === 1) weight = 1;
                                else if (neighbor.flagType === 2) weight = 2;
                                else if (neighbor.flagType === 3) weight = -1;
                                else if (neighbor.flagType === 4) weight = -2;
                                totalWeight += weight;
                                if (weight > 0) positiveWeight += weight;
                                else if (weight < 0) negativeWeight += Math.abs(weight);
                            }
                            if (!neighbor.revealed && neighbor.flagType === 0) {
                                neighbors.push({ row: nr, col: nc });
                            }
                        }
                    }
                }

                const num = data.displayNum;
                if (num === 0 && data.hasNeighbor) {
                    if (positiveWeight === negativeWeight && positiveWeight + negativeWeight >= 2) {
                        for (const n of neighbors) {
                            revealCell(n.row, n.col);
                            if (gameOver) break;
                        }
                        if (!gameOver && neighbors.length > 0) {
                            const highlightEls = [];
                            for (const n of neighbors) {
                                const el = getCellEl(n.row, n.col);
                                if (el) {
                                    el.classList.add('chord-highlight');
                                    highlightEls.push(el);
                                }
                            }
                            setTimeout(() => {
                                for (const el of highlightEls) {
                                    el.classList.remove('chord-highlight');
                                }
                            }, 500);
                        }
                    }
                } else if (num !== 0) {
                    if (totalWeight === num) {
                        for (const n of neighbors) {
                            revealCell(n.row, n.col);
                            if (gameOver) break;
                        }
                        if (!gameOver && neighbors.length > 0) {
                            const highlightEls = [];
                            for (const n of neighbors) {
                                const el = getCellEl(n.row, n.col);
                                if (el) {
                                    el.classList.add('chord-highlight');
                                    highlightEls.push(el);
                                }
                            }
                            setTimeout(() => {
                                for (const el of highlightEls) {
                                    el.classList.remove('chord-highlight');
                                }
                            }, 500);
                        }
                    }
                }
            }

            // ---------- 游戏逻辑 ----------
            function revealCell(row, col) {
                if (!gameActive || gameOver) return;
                if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;

                const data = board[row][col];
                if (data.revealed || data.flagType > 0) return;

                if (data.weight !== 0) {
                    data.revealed = true;
                    const el = getCellEl(row, col);
                    if (el) el.classList.add('mine-exploded');
                    gameOver = true;
                    gameActive = false;
                    stopTimer();
                    revealAllMines(row, col);
                    const msg = data.weight > 0 ? (data.weight === 1 ? '踩到正雷！' : '踩到正双雷！') :
                        (data.weight === -1 ? '踩到负雷！' : '踩到负双雷！');
                    showOverlay(false, '💥', msg, '点击 😊 重新开始');
                    updateUI();
                    return;
                }

                data.revealed = true;
                revealedCount++;

                if (data.displayNum === 0 && !data.hasNeighbor) {
                    const queue = [
                        [row, col]
                    ];
                    const visited = new Set();
                    visited.add(row * COLS + col);

                    while (queue.length > 0) {
                        const [r, c] = queue.shift();
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (dr === 0 && dc === 0) continue;
                                const nr = r + dr;
                                const nc = c + dc;
                                if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
                                const key = nr * COLS + nc;
                                if (visited.has(key)) continue;
                                const neighbor = board[nr][nc];
                                if (neighbor.revealed || neighbor.flagType > 0 || neighbor.weight !== 0) continue;
                                neighbor.revealed = true;
                                revealedCount++;
                                visited.add(key);
                                if (neighbor.displayNum === 0 && !neighbor.hasNeighbor) {
                                    queue.push([nr, nc]);
                                }
                            }
                        }
                    }
                }

                updateUI();

                if (checkWin()) {
                    gameOver = true;
                    gameActive = false;
                    stopTimer();
                    updateUI();
                    showOverlay(true, '🎉', '恭喜你赢了！', '点击 😊 再来一局');
                }
            }

            function toggleFlag(row, col) {
                if (!gameActive || gameOver) return;
                if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;

                const data = board[row][col];
                if (data.revealed) return;

                const oldType = data.flagType;
                let newType;
                if (oldType === 0) newType = 1;
                else if (oldType === 1) newType = 2;
                else if (oldType === 2) newType = 3;
                else if (oldType === 3) newType = 4;
                else newType = 0;

                if (newType === 0 && oldType !== 0) flagCount--;
                else if (newType !== 0 && oldType === 0) flagCount++;

                data.flagType = newType;
                updateUI();
            }

            function revealAllMines(explodedRow, explodedCol) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const data = board[r][c];
                        const el = getCellEl(r, c);
                        if (!el) continue;

                        if (data.weight !== 0) {
                            if (!data.revealed) {
                                if (data.flagType === 0) {
                                    data.revealed = true;
                                    el.className = 'cell revealed mine-shown';
                                    const span = document.createElement('span');
                                    span.className = 'mine-icon';
                                    if (data.weight === 1) span.textContent = '💣';
                                    else if (data.weight === 2) span.textContent = '💥';
                                    else if (data.weight === -1) span.textContent = '❄️';
                                    else if (data.weight === -2) span.textContent = '🌀';
                                    el.appendChild(span);
                                } else {
                                    el.className = 'cell flagged';
                                    const label = document.createElement('span');
                                    label.className = 'flag-label';
                                    if (data.flagType === 1) {
                                        label.textContent = '+1';
                                        label.classList.add('pos1');
                                    } else if (data.flagType === 2) {
                                        label.textContent = '+2';
                                        label.classList.add('pos2');
                                    } else if (data.flagType === 3) {
                                        label.textContent = '-1';
                                        label.classList.add('neg1');
                                    } else if (data.flagType === 4) {
                                        label.textContent = '-2';
                                        label.classList.add('neg2');
                                    }
                                    el.appendChild(label);
                                }
                            }
                        } else {
                            if (data.flagType > 0 && !data.revealed) {
                                el.className = 'cell flag-wrong';
                                const span = document.createElement('span');
                                span.className = 'wrong-icon';
                                span.textContent = '❌';
                                el.appendChild(span);
                            }
                        }
                    }
                }

                if (explodedRow !== undefined && explodedCol !== undefined) {
                    const el = getCellEl(explodedRow, explodedCol);
                    if (el) {
                        el.className = 'cell revealed mine-exploded';
                        el.textContent = '';
                        const span = document.createElement('span');
                        span.className = 'mine-icon';
                        const data = board[explodedRow][explodedCol];
                        if (data.weight === 1) span.textContent = '💣';
                        else if (data.weight === 2) span.textContent = '💥';
                        else if (data.weight === -1) span.textContent = '❄️';
                        else if (data.weight === -2) span.textContent = '🌀';
                        el.appendChild(span);
                    }
                }
                updateUI();
            }

            function checkWin() {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const data = board[r][c];
                        if (data.weight === 0 && !data.revealed) return false;
                    }
                }
                return true;
            }

            // ---------- 计时器 ----------
            function startTimer() {
                if (timerStarted) return;
                timerStarted = true;
                seconds = 0;
                timerDisplayEl.textContent = formatTime(0);
                timerInterval = setInterval(() => {
                    seconds++;
                    if (seconds > 999) seconds = 999;
                    timerDisplayEl.textContent = formatTime(seconds);
                }, 1000);
            }
            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                timerStarted = false;
            }
            function resetTimer() {
                stopTimer();
                seconds = 0;
                timerDisplayEl.textContent = formatTime(0);
                timerStarted = false;
            }

            // ---------- 遮罩 ----------
            function showOverlay(isWin, icon, text, sub) {
                resultIcon.textContent = icon;
                resultText.textContent = text;
                resultSub.textContent = sub;
                overlay.classList.add('show');
                overlay.style.animation = 'none';
                requestAnimationFrame(() => {
                    overlay.style.animation = 'fadeIn 0.35s ease';
                });
            }
            function hideOverlay() {
                overlay.classList.remove('show');
            }

            // ---------- 重置游戏 ----------
            function resetGame() {
                stopTimer();
                resetTimer();
                hideOverlay();
                gameActive = true;
                gameOver = false;
                firstClick = true;
                flagCount = 0;
                revealedCount = 0;
                board = createEmptyBoard();
                render();
                updateUI();
                resetBtn.textContent = '😊';
                resetBtn.classList.remove('game-over');
                clearTouchState();
                gridWrapper.scrollTop = 0;
                gridWrapper.scrollLeft = 0;
            }

            // ---------- 首次点击 ----------
            function handleFirstClick(row, col) {
                if (!firstClick) return;
                firstClick = false;
                placeMines(board, row, col);
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c].weight !== 0) continue;
                        let sum = 0;
                        let has = false;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (dr === 0 && dc === 0) continue;
                                const nr = r + dr;
                                const nc = c + dc;
                                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                                    const w = board[nr][nc].weight;
                                    if (w !== 0) has = true;
                                    sum += w;
                                }
                            }
                        }
                        board[r][c].displayNum = sum;
                        board[r][c].hasNeighbor = has;
                    }
                }
                updateUI();
                startTimer();
                revealCell(row, col);
            }

            // ---------- 事件辅助 ----------
            function getCellFromEvent(e) {
                let target = e.target;
                while (target && !target.classList.contains('cell')) {
                    target = target.parentElement;
                }
                if (!target || !target.classList.contains('cell')) return null;
                const row = parseInt(target.dataset.row, 10);
                const col = parseInt(target.dataset.col, 10);
                if (isNaN(row) || isNaN(col)) return null;
                return { el: target, row, col };
            }

            // ---------- 触摸事件 ----------
            function onTouchStart(e) {
                if (!gameActive || gameOver) return;
                const touch = e.touches[0];
                if (!touch) return;

                const result = getCellFromEvent({ target: document.elementFromPoint(touch.clientX, touch.clientY) });
                if (!result) return;

                e.preventDefault();

                const { el, row, col } = result;
                const data = board[row][col];
                if (data.revealed && data.displayNum === 0 && !data.hasNeighbor) return;

                touchState.cell = el;
                touchState.row = row;
                touchState.col = col;
                touchState.startX = touch.clientX;
                touchState.startY = touch.clientY;
                touchState.isLongPress = false;

                touchState.timer = setTimeout(() => {
                    if (touchState.cell && gameActive && !gameOver) {
                        touchState.isLongPress = true;
                        if (navigator.vibrate) navigator.vibrate(12);

                        const currentData = board[touchState.row][touchState.col];
                        if (currentData.revealed) {
                            chord(touchState.row, touchState.col);
                        } else {
                            toggleFlag(touchState.row, touchState.col);
                        }
                        clearTimeout(touchState.timer);
                        touchState.timer = null;
                    }
                }, LONG_PRESS_MS);
            }

            function onTouchMove(e) {
                if (!gameActive || gameOver) return;
                if (!touchState.cell) return;

                const touch = e.touches[0];
                if (!touch) return;

                const dx = touch.clientX - touchState.startX;
                const dy = touch.clientY - touchState.startY;
                if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
                    clearTimeout(touchState.timer);
                    touchState.timer = null;
                    touchState.cell = null;
                    e.preventDefault();
                    return;
                }

                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                if (el !== touchState.cell && !touchState.cell.contains(el)) {
                    clearTimeout(touchState.timer);
                    touchState.timer = null;
                    touchState.cell = null;
                    e.preventDefault();
                    return;
                }
                e.preventDefault();
            }

            function onTouchEnd(e) {
                if (touchState.timer) {
                    clearTimeout(touchState.timer);
                    touchState.timer = null;
                }
                if (touchState.isLongPress) {
                    touchState.cell = null;
                    touchState.isLongPress = false;
                    if (e.cancelable) e.preventDefault();
                    return;
                }

                if (touchState.cell && gameActive && !gameOver) {
                    const { row, col } = touchState;
                    const data = board[row][col];
                    if (!data.revealed && data.flagType === 0) {
                        if (firstClick) {
                            handleFirstClick(row, col);
                        } else {
                            revealCell(row, col);
                        }
                    }
                }
                touchState.cell = null;
                if (e.cancelable) e.preventDefault();
            }

            function onTouchCancel(e) {
                clearTimeout(touchState.timer);
                touchState.timer = null;
                touchState.cell = null;
                touchState.isLongPress = false;
                if (e.cancelable) e.preventDefault();
            }

            function clearTouchState() {
                clearTimeout(touchState.timer);
                touchState.timer = null;
                touchState.cell = null;
                touchState.isLongPress = false;
            }

            // ---------- 鼠标事件 (PC) ----------
            function onCellClick(e) {
                if (!gameActive || gameOver) return;
                const result = getCellFromEvent(e);
                if (!result) return;
                const { row, col } = result;
                const data = board[row][col];
                if (data.revealed || data.flagType > 0) return;

                if (firstClick) {
                    handleFirstClick(row, col);
                } else {
                    revealCell(row, col);
                }
                e.preventDefault();
            }

            function onCellRightClick(e) {
                e.preventDefault();
                if (!gameActive || gameOver) return;
                const result = getCellFromEvent(e);
                if (!result) return;
                const { row, col } = result;
                const data = board[row][col];
                if (data.revealed) return;
                toggleFlag(row, col);
            }

            // ---------- 重置按钮 ----------
            function onResetClick(e) {
                e.preventDefault();
                resetGame();
            }

            // ---------- 设置面板事件 ----------
            function initSettings() {
                buildPresetButtons();
                presetGrid.addEventListener('click', function(e) {
                    const btn = e.target.closest('.preset-btn');
                    if (!btn) return;
                    const idx = parseInt(btn.dataset.index, 10);
                    if (!isNaN(idx)) {
                        applyPreset(idx);
                    }
                });

                settingsTabs.addEventListener('click', function(e) {
                    const btn = e.target.closest('button');
                    if (!btn) return;
                    const tab = btn.dataset.tab;
                    if (!tab) return;
                    settingsTabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.settings-tab-content').forEach(el => el.classList.remove('active'));
                    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
                });

                settingsBtn.addEventListener('click', function() {
                    buildSettingsItems();
                    configRows.value = ROWS;
                    configCols.value = COLS;
                    configMines.value = TOTAL_MINES;
                    configPosDouble.value = POS_DOUBLE;
                    configNegTotal.value = NEG_TOTAL;
                    configNegDouble.value = NEG_DOUBLE;
                    updateHints();
                    settingsOverlay.classList.add('open');
                });

                settingsClose.addEventListener('click', function() {
                    settingsOverlay.classList.remove('open');
                });

                settingsOverlay.addEventListener('click', function(e) {
                    if (e.target === this) settingsOverlay.classList.remove('open');
                });

                resetDefaultColorsBtn.addEventListener('click', function() {
                    resetToDefaultColors();
                });

                saveSettingsBtn.addEventListener('click', function() {
                    const colorMap = {};
                    settingsItems.querySelectorAll('.settings-group').forEach(group => {
                        const varName = group.dataset.var;
                        const textInput = group.querySelector('input[type="text"]');
                        let val = textInput.value.trim();
                        if (!/^#[0-9a-fA-F]{6}$/.test(val)) {
                            const colorInput = group.querySelector('input[type="color"]');
                            val = colorInput.value;
                        }
                        colorMap[varName] = val;
                    });
                    applyColors(colorMap);
                    saveColorsToStorage(colorMap);

                    saveConfigAndApply();
                    settingsOverlay.classList.remove('open');
                });

                configRows.addEventListener('change', updateHints);
                configCols.addEventListener('change', updateHints);
                configMines.addEventListener('input', updateHints);
                configPosDouble.addEventListener('input', updateHints);
                configNegTotal.addEventListener('input', updateHints);
                configNegDouble.addEventListener('input', updateHints);
            }

            // ---------- 初始化 ----------
            function initEvents() {
                gridWrapper.addEventListener('touchstart', onTouchStart, { passive: false });
                gridWrapper.addEventListener('touchmove', onTouchMove, { passive: false });
                gridWrapper.addEventListener('touchend', onTouchEnd, { passive: false });
                gridWrapper.addEventListener('touchcancel', onTouchCancel, { passive: false });

                gridEl.addEventListener('click', onCellClick);
                gridEl.addEventListener('contextmenu', onCellRightClick);

                resetBtn.addEventListener('click', onResetClick);
                resetBtn.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                }, { passive: true });

                initSettings();
            }

            function init() {
                const savedColors = loadColorsFromStorage();
                if (savedColors) {
                    applyColors(savedColors);
                } else {
                    applyColors(defaultColors);
                }

                const savedConfig = loadConfigFromStorage();
                if (savedConfig) {
                    applyConfig(savedConfig.rows, savedConfig.cols, savedConfig.mines,
                        savedConfig.posDouble, savedConfig.negTotal, savedConfig.negDouble);
                } else {
                    applyConfig(DEFAULT_ROWS, DEFAULT_COLS, DEFAULT_MINES,
                        DEFAULT_POS_DOUBLE, DEFAULT_NEG_TOTAL, DEFAULT_NEG_DOUBLE);
                }

                resetGame();
                initEvents();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
