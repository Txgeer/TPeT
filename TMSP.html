<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>扫雷 · 正负雷</title>
    <style>
        /* ===== CSS 变量（默认配色） ===== */
        :root {
            --cell-bg: #b8c0cd;
            --revealed-bg: #e9edf2;
            --num1-color: #2c7be5;
            --num2-color: #27ae60;
            --num3-color: #e74c3c;
            --num4-color: #1a237e;
            --num5-color: #7f1d1d;
            --num6-color: #00838f;
            --num7-color: #1a1a2e;
            --num8-color: #5d6d7e;
            --neg-num1-color: #d94b8a;
            --neg-num2-color: #d94b2a;
            --neg-num3-color: #2b8fe7;
            --neg-num4-color: #e7c82b;
            --neg-num5-color: #2be7c8;
            --neg-num6-color: #e72b8f;
            --neg-num7-color: #8f2be7;
            --neg-num8-color: #2b8fe7;
            --zero-color: #ffffff;
            --cell-size: 32px;
            --gap-size: 3px;
            --flag-pos1-color: #e74c3c;
            --flag-pos2-color: #d35400;
            --flag-neg1-color: #2c7be5;
            --flag-neg2-color: #8e44ad;
        }

        /* ===== 全局重置 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #e8ecf1;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            touch-action: pan-y;
        }

        .game-container {
            background: #ffffff;
            border-radius: 28px;
            padding: 20px 18px 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            transition: all 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            max-height: 90dvh;
        }

        .game-title {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #8e9aaf;
            letter-spacing: 2px;
            margin-bottom: 14px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0f3f7;
            border-radius: 14px;
            padding: 6px 10px;
            margin-bottom: 14px;
            font-weight: 600;
            height: 52px;
            gap: 4px;
            flex-shrink: 0;
        }

        .status-mines {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 8px;
            flex: 1;
            min-width: 0;
            padding: 2px 0;
        }
        .mine-remain-item {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
        }
        .mine-remain-item .label {
            font-weight: 600;
            font-size: 10px;
        }
        .mine-remain-item .num {
            font-size: 13px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 14px;
            text-align: center;
        }
        .mine-remain-item.pos1 .label { color: var(--flag-pos1-color); }
        .mine-remain-item.pos1 .num { color: var(--flag-pos1-color); }
        .mine-remain-item.pos2 .label { color: var(--flag-pos2-color); }
        .mine-remain-item.pos2 .num { color: var(--flag-pos2-color); }
        .mine-remain-item.neg1 .label { color: var(--flag-neg1-color); }
        .mine-remain-item.neg1 .num { color: var(--flag-neg1-color); }
        .mine-remain-item.neg2 .label { color: var(--flag-neg2-color); }
        .mine-remain-item.neg2 .num { color: var(--flag-neg2-color); }
        .mine-remain-item .num.negative {
            color: #e74c3c !important;
        }

        .status-buttons {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .reset-btn, .settings-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .reset-btn:active, .settings-btn:active {
            transform: scale(0.88);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }
        .settings-btn {
            font-size: 18px;
        }
        .reset-btn.game-over {
            animation: pulse 0.6s ease 3;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .status-timer {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #2c3e50;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
            font-size: 14px;
        }
        .status-timer .icon {
            font-size: 16px;
            line-height: 1;
        }
        .status-timer .number {
            min-width: 28px;
            text-align: center;
            background: #1a1a2e;
            color: #f5426c;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            font-family: 'Courier New', monospace;
        }

        /* ===== 网格容器 ===== */
        .grid-wrapper {
            position: relative;
            touch-action: pan-x pan-y;
            border-radius: 12px;
            overflow: auto;
            background: #d1d6de;
            padding: 3px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
            flex: 1;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #b0b8c4 #d1d6de;
        }
        .grid-wrapper::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .grid-wrapper::-webkit-scrollbar-thumb {
            background: #b0b8c4;
            border-radius: 4px;
        }
        .grid-wrapper::-webkit-scrollbar-track {
            background: #d1d6de;
        }

        .grid {
            display: grid;
            gap: var(--gap-size);
            background: #d1d6de;
            width: fit-content;
            height: fit-content;
        }

        .cell {
            background: var(--cell-bg);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--cell-size) * 0.6);
            font-weight: 800;
            cursor: pointer;
            transition: background 0.1s ease, transform 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12), inset 0 2px 0 rgba(255, 255, 255, 0.35);
            color: #1a1a2e;
            touch-action: none;
            position: relative;
            will-change: transform;
            width: var(--cell-size);
            height: var(--cell-size);
            flex-shrink: 0;
        }
        .cell:active:not(.revealed):not(.flagged) {
            transform: scale(0.92);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
        }
        .cell.revealed {
            background: var(--revealed-bg);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06);
            cursor: default;
        }
        .cell.revealed:active {
            transform: none;
        }
        .cell.flagged {
            background: var(--cell-bg);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12), inset 0 2px 0 rgba(255, 255, 255, 0.35);
        }
        .cell.flagged .flag-label {
            font-size: calc(var(--cell-size) * 0.5);
            font-weight: 700;
            line-height: 1;
        }
        .cell.flagged .flag-label.pos1 { color: var(--flag-pos1-color); }
        .cell.flagged .flag-label.pos2 { color: var(--flag-pos2-color); }
        .cell.flagged .flag-label.neg1 { color: var(--flag-neg1-color); }
        .cell.flagged .flag-label.neg2 { color: var(--flag-neg2-color); }

        .cell.mine-exploded {
            background: #f5426c !important;
            box-shadow: inset 0 0 0 2px #c0392b !important;
        }
        .cell.mine-shown {
            background: var(--revealed-bg);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06);
        }
        .cell.mine-shown .mine-icon {
            font-size: calc(var(--cell-size) * 0.55);
            line-height: 1;
        }
        .cell.flag-wrong {
            background: #e9edf2;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06);
        }
        .cell.flag-wrong .wrong-icon {
            font-size: calc(var(--cell-size) * 0.5);
            color: #e74c3c;
        }

        .cell.n1 { color: var(--num1-color); }
        .cell.n2 { color: var(--num2-color); }
        .cell.n3 { color: var(--num3-color); }
        .cell.n4 { color: var(--num4-color); }
        .cell.n5 { color: var(--num5-color); }
        .cell.n6 { color: var(--num6-color); }
        .cell.n7 { color: var(--num7-color); }
        .cell.n8 { color: var(--num8-color); }
        .cell.nn1 { color: var(--neg-num1-color); }
        .cell.nn2 { color: var(--neg-num2-color); }
        .cell.nn3 { color: var(--neg-num3-color); }
        .cell.nn4 { color: var(--neg-num4-color); }
        .cell.nn5 { color: var(--neg-num5-color); }
        .cell.nn6 { color: var(--neg-num6-color); }
        .cell.nn7 { color: var(--neg-num7-color); }
        .cell.nn8 { color: var(--neg-num8-color); }
        .cell.zero { color: var(--zero-color); }

        .cell.chord-highlight {
            box-shadow: 0 0 0 3px #ffcc00, 0 0 12px #ffaa00 !important;
            z-index: 2;
            transition: box-shadow 0.15s ease;
        }
        .cell.revealed.chord-highlight {
            box-shadow: 0 0 0 3px #ffcc00, 0 0 12px #ffaa00 !important;
        }

        .footer-hint {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 14px;
            font-size: 12px;
            color: #8e9aaf;
            font-weight: 500;
            letter-spacing: 0.3px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .footer-hint span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .footer-hint .hint-icon {
            font-size: 16px;
        }

        .game-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 12px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 10;
            animation: fadeIn 0.35s ease;
        }
        .game-overlay.show {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .game-overlay .result-icon { font-size: 56px; line-height: 1; }
        .game-overlay .result-text { font-size: 22px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 12px rgba(0,0,0,0.2); }
        .game-overlay .result-sub { font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 2px; }

        /* ===== 设置面板 ===== */
        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .settings-overlay.open {
            display: flex;
        }
        .settings-panel {
            background: #ffffff;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            max-height: 85vh;
            padding: 24px 20px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .settings-header h2 { font-size: 18px; font-weight: 700; color: #1a1a2e; }
        .settings-close {
            background: none;
            border: none;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            color: #8e9aaf;
            padding: 0 4px;
            touch-action: manipulation;
        }
        .settings-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-shrink: 0;
            border-bottom: 2px solid #eef0f2;
            padding-bottom: 8px;
        }
        .settings-tabs button {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: 600;
            color: #8e9aaf;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            border-bottom: 2px solid transparent;
            margin-bottom: -10px;
            touch-action: manipulation;
        }
        .settings-tabs button.active {
            color: #2c7be5;
            border-bottom-color: #2c7be5;
        }
        .settings-tabs button:active {
            transform: scale(0.96);
        }
        .settings-tab-content {
            display: none;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }
        .settings-tab-content.active {
            display: block;
        }

        .settings-group { margin-bottom: 14px; }
        .settings-group label { display: block; font-size: 13px; font-weight: 600; color: #2c3e50; margin-bottom: 4px; }
        .settings-color-row { display: flex; align-items: center; gap: 12px; }
        .settings-color-row input[type="color"] {
            width: 44px; height: 44px; border: 2px solid #d1d6de; border-radius: 8px; padding: 2px;
            cursor: pointer; background: transparent; flex-shrink: 0;
        }
        .settings-color-row input[type="text"] {
            flex: 1; padding: 8px 10px; border: 1.5px solid #d1d6de; border-radius: 8px;
            font-size: 14px; font-family: monospace; background: #f8f9fa; color: #1a1a2e;
            outline: none; transition: border 0.15s;
        }
        .settings-color-row input[type="text"]:focus { border-color: #2c7be5; }

        .config-group { margin-bottom: 16px; }
        .config-group label { display: block; font-size: 13px; font-weight: 600; color: #2c3e50; margin-bottom: 4px; }
        .config-group input[type="number"] {
            width: 100%; padding: 10px 12px; border: 1.5px solid #d1d6de; border-radius: 8px;
            font-size: 16px; background: #f8f9fa; color: #1a1a2e; outline: none; transition: border 0.15s;
            -moz-appearance: textfield;
        }
        .config-group input[type="number"]:focus { border-color: #2c7be5; }
        .config-group input[type="number"]::-webkit-outer-spin-button,
        .config-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        .config-hint { font-size: 12px; color: #8e9aaf; margin-top: 4px; }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 6px;
        }
        .preset-btn {
            padding: 6px 4px;
            border: 1.5px solid #d1d6de;
            border-radius: 8px;
            background: #f8f9fa;
            font-size: 11px;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            touch-action: manipulation;
            text-align: center;
            line-height: 1.3;
            min-height: 32px;
        }
        .preset-btn:active {
            transform: scale(0.94);
            background: #e9ecf0;
        }
        .preset-btn:hover {
            border-color: #2c7be5;
            background: #f0f4ff;
        }
        .preset-label {
            font-size: 12px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
            display: block;
        }

        .settings-actions {
            display: flex; gap: 12px; margin-top: 16px; flex-shrink: 0;
            padding-top: 12px; border-top: 1px solid #eef0f2;
        }
        .settings-actions button {
            flex: 1; padding: 12px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            touch-action: manipulation;
        }
        .settings-actions button:active { transform: scale(0.96); }
        .btn-reset-default { background: #f0f3f7; color: #2c3e50; }
        .btn-save { background: #2c7be5; color: #ffffff; box-shadow: 0 4px 12px rgba(44,123,229,0.25); }
        .btn-save:active { box-shadow: 0 2px 6px rgba(44,123,229,0.2); }

        /* ===== 响应式 ===== */
        @media (max-width: 400px) {
            .game-container { padding: 14px 12px 18px; border-radius: 20px; }
            .status-bar { padding: 4px 8px; height: 46px; border-radius: 10px; }
            .status-mines { gap: 0 4px; }
            .mine-remain-item { font-size: 9px; }
            .mine-remain-item .num { font-size: 11px; min-width: 12px; }
            .reset-btn, .settings-btn { width: 32px; height: 32px; font-size: 18px; }
            .settings-btn { font-size: 15px; }
            .status-timer { font-size: 12px; }
            .status-timer .number { font-size: 13px; min-width: 24px; padding: 1px 4px; }
            .footer-hint { font-size: 11px; gap: 12px; margin-top: 10px; }
            .game-overlay .result-icon { font-size: 44px; }
            .game-overlay .result-text { font-size: 18px; }
            .settings-panel { padding: 20px 16px 16px; }
            .settings-color-row input[type="color"] { width: 38px; height: 38px; }
            :root { --cell-size: 28px; }
            .preset-btn { font-size: 10px; padding: 4px 3px; min-height: 28px; }
        }
        @media (max-width: 360px) {
            .game-container { padding: 10px 8px 14px; border-radius: 16px; }
            .status-bar { padding: 3px 6px; height: 40px; border-radius: 8px; }
            .status-mines { gap: 0 3px; }
            .mine-remain-item { font-size: 8px; }
            .mine-remain-item .num { font-size: 10px; min-width: 10px; }
            .reset-btn, .settings-btn { width: 28px; height: 28px; font-size: 15px; }
            .settings-btn { font-size: 13px; }
            .status-timer { font-size: 10px; }
            .status-timer .number { font-size: 11px; min-width: 20px; padding: 1px 3px; }
            .footer-hint { font-size: 10px; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
            .game-overlay .result-icon { font-size: 36px; }
            .game-overlay .result-text { font-size: 16px; }
            .game-title { font-size: 11px; margin-bottom: 10px; }
            .settings-panel { padding: 16px 12px 14px; }
            .settings-color-row input[type="color"] { width: 34px; height: 34px; }
            .settings-color-row input[type="text"] { font-size: 12px; padding: 6px 8px; }
            :root { --cell-size: 24px; }
            .preset-btn { font-size: 9px; padding: 3px 2px; min-height: 24px; }
        }
        @media (max-height: 500px) and (orientation: landscape) {
            .game-container { padding: 10px 16px 14px; max-width: 380px; max-height: 95vh; }
            .game-title { display: none; }
            .status-bar { height: 36px; padding: 3px 8px; margin-bottom: 8px; }
            .mine-remain-item { font-size: 8px; }
            .mine-remain-item .num { font-size: 10px; min-width: 10px; }
            .reset-btn, .settings-btn { width: 28px; height: 28px; font-size: 15px; }
            .settings-btn { font-size: 13px; }
            .status-timer { font-size: 10px; }
            .status-timer .number { font-size: 11px; min-width: 20px; padding: 1px 3px; }
            .footer-hint { margin-top: 6px; font-size: 10px; }
            .settings-panel { max-height: 90vh; padding: 16px; }
            :root { --cell-size: 24px; }
            .preset-btn { font-size: 9px; padding: 3px 2px; min-height: 24px; }
        }
        @supports (padding: max(0px)) {
            .game-container { padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
        }
    </style>
</head>
<body>

    <div class="game-container" id="app">
        <div class="game-title">💣 扫雷 · 正负雷</div>

        <!-- ===== 状态栏 ===== -->
        <div class="status-bar">
            <div class="status-mines" id="statusMines">
                <span class="mine-remain-item pos1"><span class="label">+1</span><span class="num" id="pos1Remain">0</span></span>
                <span class="mine-remain-item pos2"><span class="label">+2</span><span class="num" id="pos2Remain">0</span></span>
                <span class="mine-remain-item neg1"><span class="label">-1</span><span class="num" id="neg1Remain">0</span></span>
                <span class="mine-remain-item neg2"><span class="label">-2</span><span class="num" id="neg2Remain">0</span></span>
            </div>
            <div class="status-buttons">
                <button class="reset-btn" id="resetBtn" aria-label="重新开始">😊</button>
                <button class="settings-btn" id="settingsBtn" aria-label="设置">⚙️</button>
            </div>
            <div class="status-timer">
                <span class="icon">⏱</span>
                <span class="number" id="timerDisplay">000</span>
            </div>
        </div>

        <!-- ===== 网格 ===== -->
        <div class="grid-wrapper" id="gridWrapper">

    <!-- ===== 设置面板 ===== -->
    <div class="settings-overlay" id="settingsOverlay">

                <button class="active" data-tab="color">🎨 颜色</button>

                <div id="settingsItems"></div>

            <div class="settings-tab-content" id="tabConfig">
                <div class="config-group" style="margin-bottom: 12px;">
                    <span class="preset-label">📌 预设配置</span>

                </div>
                <div class="config-group">
                    <label for="configRows">高度（行数）</label>
                    <input type="number" id="configRows" min="1" max="72" value="9">
                    <div class="config-hint">1 ~ 72</div>
                </div>

                    <label for="configCols">宽度（列数）</label>
                    <input type="number" id="configCols" min="1" max="72" value="9">

                    <label for="configMines">总雷数</label>

                    <div class="config-hint" id="mineHint">最大 ≤ floor(行×列/2)</div>

                    <label for="configPosDouble">正双雷数量 (+2)</label>
                    <input type="number" id="configPosDouble" min="0" value="0">

                </div>
                <div class="config-group">
                    <label for="configNegTotal">负雷总数 (-1 和 -2)</label>
                    <input type="number" id="configNegTotal" min="0" value="0">
                    <div class="config-hint" id="negTotalHint">≤ 总雷数 − 正双雷数</div>
                </div>
                <div class="config-group">
                    <label for="configNegDouble">负双雷数量 (-2)</label>
                    <input type="number" id="configNegDouble" min="0" value="0">
                    <div class="config-hint">0 ~ 负雷总数</div>

                <button class="btn-save" id="saveSettings">保存</button>
