<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HYPERNGdle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,700;14..32,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="app" role="main">
        <div class="app-header">
            <h1 class="title">HYPERNGdle</h1>
            <div class="theme-switcher" id="themeSwitcher">
                <button class="theme-btn" data-theme="light" aria-label="亮色主题">☀️</button>
                <button class="theme-btn" data-theme="dark" aria-label="暗色主题">🌙</button>
                <button class="theme-btn" data-theme="auto" aria-label="跟随系统">🤖</button>
            </div>
        </div>

        <div class="number-card" id="numberCard">
            <div class="number-card__label">Your Number</div>
            <div class="number-card__digits" id="digitsContainer">
                <!-- 10 个占位符，JS 会填充 -->
            </div>
        </div>

        <button class="btn-generate" id="generateBtn" aria-label="生成新的10位随机数">
            <span class="btn__text">Generate</span>
            <span class="btn__spinner"></span>
        </button>

        <!-- ===== 新增：自动抽取开关 ===== -->
        <div class="auto-generate-controls">
            <button id="autoGenerateBtn" class="btn-toggle-badges">自动抽取: 关</button>
        </div>

        <!-- 徽章 & 得分区域 -->
        <div class="badge-area" id="badgeArea">
            <div class="badge-area__scores">
                <div class="badge-controls">
                    <button id="toggleBadgeDisplay" class="btn-toggle-badges">隐藏未获得徽章</button>
                    <button id="filterBtn" class="btn-toggle-badges btn-filter">🔍 全部</button>
                    <button id="hardResetBtn" class="btn-toggle-badges btn-reset" style="color: #f87171; border-color: #f87171;">硬重置</button>
                    <button class="btn-share" id="shareBtn" aria-label="分享当前数字"><span>📤 分享</span></button>
                </div>
                <div class="badge-score-item">
                    <span class="badge-score-label">总次数：</span>
                    <span class="badge-score-value" id="totalGenerations">0</span>
                </div>
                <div class="badge-score-item">
                    <span class="badge-score-label">当前数字 TP：</span>
                    <span class="badge-score-value" id="currentScore">0</span>
                </div>
                <div class="badge-score-item">
                    <span class="badge-score-label">总 TP：</span>
                    <span class="badge-score-value" id="totalScore">0</span>
                </div>
                <div class="badge-score-item best-record" id="bestRecord">
                    <span class="best-label">🏆 历史最佳：</span>
                    <span class="best-number" id="bestNumber">—</span>
                    <span class="best-score" id="bestScore">0 TP</span>
                </div>
            </div>
            <div class="badge-list" id="badgeList"></div>
        </div>

        <div class="footer">10 digits · pure random</div>
    </div>

    <!-- 按顺序加载 JS -->
    <script src="math-utils.js"></script>
    <script src="badge-defs.js"></script>
    <script src="badges.js"></script>
    <script src="app.js"></script>
</body>
</html>
